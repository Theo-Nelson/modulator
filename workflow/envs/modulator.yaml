# workflow/envs/modulator.yaml
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.13.7
  - pip
  - pandas=2.3.3
  - numpy=2.3.3
  - matplotlib=3.10.6
  - pysam=0.23.3
  - pyyaml
  - samtools=1.22.1
  - scipy
  - setuptools>=69
  - ont-modkit=0.5.0
  # pyroaring 1.1.0 is PyPI-only (conda-forge stops at 0.3.5), so install it from pip
  # during env creation rather than as a conda dependency (which is unsatisfiable).
  - pip:
    - pyroaring==1.1.0
