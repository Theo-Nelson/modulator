# Configuration for modulator pipeline

bams_dir: "../resources/test_bams/ALCAM_NHSL1_SERAC1_MXD1_RIOK3_reads"  # <== point to your BAM dir
bam_glob: "*.bam"                                                       # pattern to match BAMs

reference:
  fasta: nonexistant_genome.fa
  gtf:   nonexistant_annotation.gtf

# assembler defaults (all overridable via --config assembler.<key>=val)
assembler:
  primary_only: true
  min_mapq: 10
  min_introns_read: 1
  require_softclip3p: 0
  apa_window: 20
  tes_window: null
  min_reads: 40
  min_frac: 0.00
  min_introns: 1
  min_polya_length: 12
  min_polya_purity: 0.5
  polya_support_frac: 0.5
  tes_match_tol: 25
  exact_tes_tol: 10
  write_zt_bams: false
  write_zt_tagged_sample_bams: true
  emit_modkit_manifest: false
  min_reads_per_sample_for_mod: 5
  min_total_reads_for_mod: 20

# --- modkit global options (common to ZN and ZT) ---
modkit:
  common:
    log_file_template: "results/{which}/{sample}.log"
    region: null
    max_depth: 1000
    include_bed: null
    include_unmapped: false
    edge_filter: null
    invert_edge_filter: false
    threads: "{threads}"
    interval_size: 100000
    queue_size: 1000
    chunk_size: null
    num_reads: 10042
    sampling_frac: null
    seed: null
    sample_region: null
    sampling_interval_size: 1000000
    no_filtering: false
    filter_thresholds: ["A:0.8","C:0.8","G:0.8","T:0.8"]
    mod_thresholds: ["17596:0.99","a:0.99","m:0.99","17802:0.99","69426:0.99","19228:0.99","19229:0.99","19227:0.99"]
    ignore: []
    force_allow_implicit: false
    motif: []
    cpg: false
    ref_mask: false
    combine_mods: false
    combine_strands: false
    mixed_delim: false
    only_tabs: false
    bedgraph: false
    header: false
    prefix: null
    suppress_progress: true
  zn:
    partition_tag: "ZN"
    per_mod_bed: true
  zt:
    partition_tag: "ZT"

# Mods and reference bases
mods: ["17596", "a", "m", "17802", "69426", "19228", "19229", "19227"]
ref_bases: ["A", "A", "C", "T", "A", "C", "G", "T"]

# Threads
threads: 64

# Prefix for outputs
prefix: "fivegenes_readbacked_annot"

# Assembly filters (relaxed for test data)
min_reads: 1
min_frac: 0.0001

# Minimum coverage
min_cov: 5
min_cov_test: 20

# Top k for plots
topk: 10
