# Configuration for the package-first modulator runner.
# Typical usage:
#   modulator run --config config/config.yaml --set reference_fa=/path/to/ref.fa reference_gtf=/path/to/ref.gtf

bams_dir: "resources/test_bams/ALCAM_NHSL1_SERAC1_MXD1_RIOK3_reads"
bam_glob: "*.bam"

# Samplesheet (optional): the SAMPLE SOURCE + the metadata for between-condition comparisons.
# When set it REPLACES bams_dir/bam_glob discovery -- each row's `bam` is staged as a symlink named
# <sample>.bam, so your short ids become the sample names in every output (no 60-char BAM stems):
#
#   sample   bam                      condition   replicate
#   M1       HornerLab_M1pA_*.bam     mock        1
#   Z1       HornerLab_Z1pA_*.bam     zikv        1
#
# `sample` and `bam` are required; `condition` is required for any between-condition test; any other
# columns ride along as covariates. `bam` may be absolute, relative to bams_dir, or a glob matching
# exactly one file. Symlinks only -- BAMs are never copied.
samplesheet: ""            # e.g. config/samples.tsv

# Preflight: validate the input BAMs BEFORE any stage runs, so mistakes fail fast with a clear
# message instead of a cryptic mid-run modkit error or silently wrong statistics.
preflight:
  enable: true
  check_duplicate_bams: true   # ERROR if two samples resolve to the same physical file (pseudo-replication); WARN on distinct same-size files (likely accidental copies)
  check_bam_index: true        # ERROR if a BAM lacks a .bai/.csi index (modkit pileup + pysam require one)
  auto_index: false            # if true, build missing indexes with `samtools index` instead of erroring

# Which comparisons to run. Omit/empty -> every pairwise contrast of `condition` is derived.
contrasts: []
#   - {name: zikv_vs_mock, column: condition, test: zikv, reference: mock}

reference:
  fasta: nonexistant_genome.fa
  gtf:   nonexistant_annotation.gtf

assembler:
  primary_only: true
  min_mapq: 10
  min_introns_read: 1
  require_softclip3p: 0
  apa_window: 20
  tes_window: null
  min_reads: 40
  min_frac: 0.00
  min_introns: 1
  min_polya_length: 12
  min_polya_purity: 0.5
  polya_support_frac: 0.5
  tes_match_tol: 25
  exact_tes_tol: 10
  min_distal_anchor_reads: 2
  min_distal_anchor_frac: 0.05
  min_exact_canonical_reads: 1
  write_zt_bams: false
  write_zt_tagged_sample_bams: true
  emit_modkit_manifest: false
  min_reads_per_sample_for_mod: 5
  min_total_reads_for_mod: 20

# Classify every assembled fragmentform intron by its donor/acceptor dinucleotides
# (GT-AG canonical, GC-AG semi-canonical, AT-AC minor U12, else non-canonical) and summarize
# per gene. Read-derived, so it reports the junctions the reads actually support.
splice_junctions:
  enable: true

# Roll up read-backed NOVEL_LOCUS fragmentforms into uniquely-named loci (grouped by genomic
# overlap) with their fragmentforms, modification sites, and splice-junction category.
novel_loci:
  enable: true

multigene_filter:
  enable: true
  zero_gene_action: keep
  # What to do with reads exonically overlapping >1 gene:
  #   scrap_unresolved (default) scrap reads with NO ZT tag (genuinely ambiguous -- they would
  #                    contaminate per-gene pileups at overlapping loci) AND ZT-assignment conflicts
  #   scrap_conflict    scrap ONLY reads whose ZT-assigned gene is not among the overlapping genes
  #   keep              retain all multi-gene reads (legacy behavior; the filter was previously a no-op)
  # Reads resolved by their ZT tag (multi_gene_kept_by_zt) are always kept.
  multi_gene_action: scrap_unresolved

modkit:
  common:
    log_file_template: "results/{which}/{sample}.log"
    region: null
    # modkit pileup --max-depth: at a site deeper than this, modkit SUBSAMPLES to this many reads.
    # The modified-FRACTION stays unbiased (subsampling, not head-truncation: measured mean shift
    # +0.004 pp, median |shift| 0.02 pp on a 6000x locus), but Nvalid_cov -- the binomial denominator
    # every downstream test uses, and the depth `min_cov`/`test_diffs.min_cov` filter on -- is CAPPED,
    # not the true depth. On deep direct-RNA (real loci reach >5000x) the default 1000 discards ~2/3 of
    # the evidence at the deepest sites, costing precision (a 6000x site is tested at n~1500). Raise it
    # (e.g. 10000+) if you need the full depth in the denominator; higher costs modkit time/memory.
    max_depth: 1000
    include_bed: null
    include_unmapped: false
    edge_filter: null
    invert_edge_filter: false
    interval_size: 100000
    queue_size: 1000
    chunk_size: null
    num_reads: 10042
    sampling_frac: null
    seed: null
    sample_region: null
    sampling_interval_size: 1000000
    no_filtering: false
    filter_thresholds: ["A:0.8","C:0.8","G:0.8","T:0.8"]
    mod_thresholds: ["17596:0.99","a:0.99","m:0.99","17802:0.99","69426:0.99","19228:0.99","19229:0.99","19227:0.99"]
    ignore: []
    force_allow_implicit: false
    motif: []
    cpg: false
    ref_mask: false
    combine_mods: false
    combine_strands: false
    mixed_delim: false
    only_tabs: false
    bedgraph: false
    header: false
    prefix: null
    suppress_progress: true
  zn:
    partition_tag: "ZN"

toggles:
  enable_zn_pileup: true
  enable_zn_aggregate: true
  enable_test_diffs: true

# NEW: authoritative home for aggregation options
aggregation:
  engine: stream      # stream = k-way merge of pre-sorted ZN beds (fast, per-chrom parallel + resumable); sort = legacy aggregate_by_gene.py
  jobs: 12            # chromosomes processed in parallel by the stream engine
  zn:
    filter_enable: true
    count_diff_factor: 3                # site-filter (1): FAIL if Ndiff > count_diff_factor * coverage (drops positions dominated by a variant/misalignment rather than a modification)
    mod_fail_margin: 1                  # DEPRECATED / no-op: the confident-call guard is now the NFail-SCORE k-ratio below (nfail_score_k=1 reproduces the old margin=0 behaviour). Left here only so old configs don't error.
    # site-filter (2): NFail-SCORE k-ratio (Nelson et al.) -- the confident-call guard. FAIL if k = Nmod/(Nfail+1) < this
    # (error-prone false-positive sites carry a large Nfail; true sites a small one). k=1 => Nmod must exceed Nfail,
    # which REPLACES the old "Nmod > Nfail + mod_fail_margin" filter. CALIBRATE per modification (basecaller + model +
    # Dorado version) -- see resources/nfail_score_k_calibration.tsv (e.g. Dorado SUP m6A-DRACH v2.0.0 -> 0.4; SUP pseU
    # v2.0.0 -> 1.0). Set one value for all mods, OR a per-mod-code map (0 disables the guard). Example map:
    #   nfail_score_k:
    #     a: 0.4          # m6A (mod code 'a')
    #     "17802": 1.0    # pseU (numeric ChEBI code -- quote it so YAML keeps it a string)
    #     default: 1.0    # fallback for any mod code not listed
    nfail_score_k: 1.0
    emit_raw: false                    # RAW sites_long is huge (~all bedMethyl rows) and not consumed downstream; FILTERED is what test_diffs/genotype/report use. Set true only if you need the full pre-filter table and have disk/quota headroom.
    emit_filtered: true
    write_long: true
    write_pivots: auto                 # auto | on | off. Per-gene pivots are 3 dense files per (gene x mod) group and are NOT read downstream (inspection only). 'auto' writes them unless the run exceeds pivot_max_groups (avoids a hundreds-of-thousands-of-tiny-files explosion on whole-transcriptome runs); 'on' forces them even at scale; 'off' never writes them.
    pivot_max_groups: 2000             # auto-mode ceiling on (gene x mod) pivot groups; ~3x this many files. Raise it (or set write_pivots: on) to force pivots on a large run.
    write_raw_per_gene: false          # RAW per-gene tables (thousands of files) follow emit_raw
    write_filtered_per_gene: true      # (ZN only) FILTERED only -> small

# legacy keys kept for compatibility (ignored if aggregation.* is set)
aggregate_outputs:
  emit_raw: true
  emit_filtered: true
  write_long: true
  write_pivots: auto        # auto | on | off (see aggregation.zn.write_pivots)
  pivot_max_groups: 2000
  # NOTE: the code reads these WITHOUT the old `_tables` suffix (aggregate_outputs.write_raw_per_gene).
  # The previously-shipped `write_raw_per_gene_tables` keys were silently ignored -- renamed so this
  # legacy fallback actually takes effect.
  write_raw_per_gene: false
  write_filtered_per_gene: true

aggregation_tmpdir: null   # optional override; can set on CLI
aggregation_chunk_lines: null

filters:
  enable_site_filter: true
  count_diff_factor: 3
  mod_fail_margin: 1

threads: 64
prefix: "fivegenes_readbacked_annot"

min_cov: 0

test_diffs:
  min_cov: 20          # overrides min_cov_test if present
  topk: 10             # plots
  test: auto           # auto | fisher | chi2
  pseudocount: 0.5     # for chi-square stability
  alternative: two-sided   # fisher alternative
  gene_filter: null     # e.g., ["ALCAM","RIOK3"]
  mod_filter: null      # e.g., ["a","m"]

# Post-test_diffs granular structural classification of significant ZN sites.
# Assigns each significant between-isoform site a single MECE category explaining
# WHY the isoforms differ in modification stoichiometry there (IPA-private, EJC
# relief, tandem-APA, alternative last exon, etc.), anchored to the
# longest-3'UTR isoform. Covers ALL detected modifications, not just m6A. Only sites
# passing fdr AND min_effect (the >10% absolute rule) classify.
classify_diffs:
  enable: true
  min_effect: 0.10      # >10% absolute stoichiometry difference gate
  fdr: 0.05             # BH-FDR gate (p_adj_bh)
  mod_filter: null      # null -> ALL detected modifications; e.g. ["a"] for m6A only
  min_cov: 0            # extra per-isoform Ncov floor (test_diffs already filters)
  tes_tol: 25           # TES match tolerance for architecture/APA calls; matches the assembler's tes_match_tol so "same TES" is consistent between assembly and classification (was 200, which lumped sub-200bp tandem-APA into SHARED_TERMINAL_EXON)
  arch_tol: 50          # isoform-architecture (IPA vs full-length) classification tolerance; how far a TES may sit inside/outside the reference terminal exon (feeds classify_arch). Renamed from inside_tol.
  ejc_nt: 150           # EJC/cleavage footprint (nt): max base-to-decision distance for IPA_NO_EXTENSION (a splice-vs-poly(A) site at the base). NOTE this is a near-vs-distal boundary (a monotone tolerance): a base farther than ejc_nt from the same decision is classified DISTAL_APA instead, so widening ejc_nt moves sites from DISTAL_APA into IPA_NO_EXTENSION.
  figures: true         # render per-category figures (isoform architecture maps + 2-panel stoich)
  figs_per_category: 10 # top sites (by effect) to plot per category

report:
  enable: true
  title: "modulator HTML report"
  max_diff_figs: 6
  top_transcripts: 20
  top_genes: 20
  max_class_figs_per_category: 10   # per-category figures embedded in the report
  max_snp_figs: 12                  # per-example figures per SNP/haplotype section (embedded + written to results/genotype/<prefix>__snp_figs/)

genotype:
  enable: true       # on by default (SNP discovery + SNP/mod/fragment associations, haplotypes). Set false to skip this (slower) stage.
  jobs: 2
  # discover_candidate_snps parallelism, decoupled from `jobs` (which sizes the memory-heavy
  # per-molecule substeps). SNP discovery is embarrassingly parallel and low-memory, so it gets its
  # own knob. 0/unset -> use the full `threads` budget. It also shards by genomic window
  # (snp_scan_window_bp) so big chromosomes split into many shards instead of one, and prefilters
  # each BAM once with samtools (native, callback-free count_coverage) for a large per-shard speedup.
  snp_scan_jobs: 0
  snp_scan_window_bp: 1000000
  min_alt_reads: 4
  min_total_cov: 8
  min_alt_frac: 0.10
  max_alt_frac: 0.90
  min_baseq: 20
  min_mapq: 10
  min_mod_site_cov: 1
  mod_sites_require_snp_link: true   # keep only mod sites whose context_key matches a candidate SNP (sites that can pair with a SNP on a shared read); lossless for snp_mod / haplotype_mod, avoids 100k+-site molecule_mod OOM on deep genome-wide data. Set false to keep all mod sites.

  # Pre-subset each BAM to the union of candidate SNP + mod-site regions (samtools view -M -L)
  # before the per-molecule scans. Every read that can contribute to a snp/mod/haplotype
  # association overlaps a candidate site, so this is lossless for every genotype output, while
  # removing the genome-wide off-target reads that otherwise force build_read_assignment_table to
  # materialize an all-reads table (~22 GB on disk / ~70 GB in pandas on deep runs).
  # NOTE: with this enabled the read-assignment table is written as
  #   <prefix>_read_assignments_candidate_regions.tsv   (reads over candidate regions)
  # instead of
  #   <prefix>_read_assignments.tsv                     (every primary read, genome-wide).
  # Set enable=false to restore the genome-wide table and skip subsetting.
  subset_bams:
    enable: true
    pad: 0        # bases to widen each candidate site before merging (0 is lossless; reads need only overlap)
    max_reads_per_fragmentform: 0   # 0 = off (full depth). N>0 caps each ZT fragmentform (isoform) to N reads by a SEEDED subsample after region-subsetting, so deep highly-expressed loci can't saturate modkit memory in build_molecule_mod_table. Every isoform keeps up to N reads. Changes results (subsampled) but deterministic for a fixed seed. ~400 is ample for the per-isoform mod/stoichiometry + association tests.
    subsample_seed: 12345
  mod_jobs: 16                       # max concurrent modkit `extract calls` in build_molecule_mod_table (decoupled from genotype.jobs; capped at `threads`). The substep now streams shards to disk so the parent RSS is bounded and this can run wide.
  mod_scan_window_bp: 1000000        # split each chrom's candidate mod sites into windows of this span so heavy chromosomes shard into many balanced modkit extracts instead of one monolith.
  mod_interval_size: 20000           # modkit extract --interval-size: bounds each modkit process's own peak RSS (independent of the parent). Raise for fewer/larger chunks (faster, more modkit RAM).
  min_group_reads: 4
  min_haplotype_reads: 4
  max_haplotype_snps: 4
  test: auto
  pseudocount: 0.5
  # Why does a SNP change a modification? classify_snp_mod_mechanism runs right after
  # test_snp_mod_assoc and adds the positional/motif/concordance axes -- and, importantly, flags
  # SELF-REPORTING variants (A-to-I and pseU change the basecall, so they get called as SNPs at their
  # own modified base; ~12% of significant snp_mod hits are that circularity). Needs the reference FASTA.
  snp_mod_mechanism: true
  # Find SNPs that sit EXACTLY on a modified base, report them separately
  # (<prefix>_snp_at_mod_base.tsv: self-reporting A-to-I / pseudouridine, or modified-base
  # ablation), and add a `snp_at_mod_base` flag column to the between-isoform and
  # between-condition differential-modification tables. A segregating variant at the modified
  # base confounds those (SNP-blind) tests -- this lets you scrutinise/exclude such sites
  # rather than recalibrating the test. Reference allele only is counted at those sites.
  snp_at_mod_base: true
  # Max distance (nt) from the modified base for a SNP to count as PROXIMAL_CIS before DISTAL_CIS.
  # The nearer tiers are fixed by the motif geometry (0 = at the modified base, <=2 = inside the
  # DRACH 5-mer, <=4 = inside the 9-mer), so only this outer boundary is tunable.
  mechanism_proximal_bp: 50
  # Co-localized modifications (mod x mod dependency): do two nearby modification sites co-occur
  # on the same molecule? The modification analogue of snp_mod_assoc. Reuses molecule_mod_calls,
  # so it costs no extra BAM/modkit work. Pairs are accumulated per-read (never a global
  # many-to-many self-merge), so memory stays O(#kept pairs).
  colocalized_mods:
    enable: true
    max_distance: 1000      # max bp between two mod sites to call them co-localized
    min_pair_reads: 8       # min shared reads covering BOTH sites
    min_state_reads: 4      # min reads in each state of site A (modified / not)
    max_sites_per_read: 200 # safety cap: skip pairing on reads with more usable calls than this

# Truncation-aware differential stoichiometry between fragmentforms -- the 5' COMPLEMENT to
# test_diffs, not a replacement.
#
# Direct-RNA reads are sequenced 3'->5' and truncate at the 5' end, so a read assigned to a
# fragmentform it never reached carries no evidence about features there. This engine restricts each
# fragmentform pair to reads that demonstrably span their structural divergence point, so the
# comparison rests on observed assignment rather than inferred assignment.
#
# MEASURED genome-wide (3,086 genes / 304k tests): the confound scales with 5' distance --
#   divergence <1kb from the 3' end : reads dropped in  0.2% of tests, 0.0% of calls change
#   1-5kb                           : 11.5% / 0.2%
#   5-20kb                          : 36.1% / 0.8%
#   >20kb                           : ~55%  / ~1.3%
# So test_diffs is already correct (and far cheaper) for 3'-proximal pairs; this earns its ~15min
# genome-wide cost only for 5'-divergent ones. Set min_divergence_from_3p to skip the rest.
# Needs the genotype stage (per-read assignment + mod-call tables). Off by default.
hierarchical_stoich:
  enable: false
  min_divergence_from_3p: 0    # nt; e.g. 5000 skips ~42% of pairs (the <1kb bulk) and keeps
                               # essentially all of the correction. 0 = test every pair.
  sites: auto                  # `auto` = restrict to the sites test_diffs already flagged (the fast
                               # path); or a path to any TSV with a mod_site_id column; or "" for all.
  min_informative_reads: 10    # min reads per fragmentform that actually span the divergence point
  min_state_reads: 3           # min reads per modification state per fragmentform
  max_fragmentforms_per_gene: 12  # cap pairs on highly-fragmented genes (keeps the best-supported)
  also_naive: true             # also emit the unrestricted result per row, so the confound is
                               # measurable per site rather than assumed

# Replicate-aware BETWEEN-CONDITION comparisons. Requires `samplesheet` above with a `condition`
# column and >=2 levels; otherwise this stage is a no-op.
#
# Counts (modification, isoform/APA/junction usage) -> beta-binomial LRT with dispersion shrinkage.
# Poly(A) tail length is continuous -> Welch across per-replicate medians.
# Reads are NEVER pooled across replicates: with millions of reads and n=3/group that is
# pseudoreplication (measured: 62% of simulated NULL sites reach p<0.05). See diffstats.py.
#
# NOTE ON POWER: these data's replicates are near-binomially reproducible (biological SD ~1 pp), so
# statistical significance is cheap -- a ~2 pp shift can clear FDR. Filter on |delta| for biological
# relevance, not on FDR alone.
between_conditions:
  enable: true
  # Which of the five differentials to run (each writes its own per-contrast TSV).
  mod_diffs: true              # differential modification (needs aggregate_zn)
  mod_by_transcript: true      # ALSO write a per-fragmentform (ZN) between-condition mod table (_mod_diffs_by_transcript.tsv) showing WHICH isoform carries the change. The site-level *_mod_diffs.tsv (pooled across fragmentforms) is ALWAYS written regardless — set false to skip only the extra per-transcript table.
  isoform_usage: true          # which isoform the gene uses      (needs assemble)
  apa_usage: true              # which 3' end / APA site it uses   (needs assemble)
  junction_usage: true         # which junctions it splices        (needs splice_junctions)
  tail_diffs: true             # poly(A) tail length               (needs the polya stage)
  min_cov: 20                  # differential modification: min per-sample coverage at a site
  min_gene_reads: 20           # differential usage: min per-sample reads for the gene (the denominator)
  min_tail_reads_per_sample: 10  # differential tail: min reads per sample for a feature's median
  min_samples_per_group: 2     # min replicates per condition (2 is the floor for any variance estimate)
  tail_level: fragmentform     # fragmentform | gene
  mod_filter: []               # restrict differential modification to these mod codes, e.g. ["a"] for
                               # m6A only. Empty = all. (a=m6A, m=5mC, 17596=inosine, 17802=pseudouridine)
  prior_weight: 20.0           # dispersion shrinkage strength (diffstats.py)
  ref_df: 10                   # F(1,df) reference for the LRT. Calibrated for near-binomial
  site_weight: auto           # dispersion-shrinkage per-site weight. "auto" = N_site-2, so
                              # shrinkage fades as the cohort grows (heterogeneous large cohorts
                              # keep their true per-site dispersion instead of being crushed onto
                              # the near-binomial bulk -> no inflated FPR at overdispersed sites).
                              # A fixed number forces a constant weight (1 = legacy behaviour).
                               # replicates (this data: phi~0.0007 -> null p<0.05 = 0.06, delta=0.10
                               # -> 60% sensitivity @ ~3.5% FDR). Genuinely overdispersed replicates
                               # need ~4; re-check on new data with a within-condition null contrast
                               # and confirm p<0.05 lands near 0.05.

# Polyadenylation-signal (PAS) motif check for every APA site (each fragmentform's TES). Scans the
# upstream window for the canonical AATAAA and the 11 known variant hexamers, scores the downstream
# U/GU-rich element, and flags likely INTERNAL PRIMING: no PAS + genomic A-rich downstream means the
# oligo-dT probably annealed to an internal A-stretch, giving a false 3' end rather than a real APA
# site. Cross-check against the measured poly(A) tail (polya stage): a genuine site carries a tail.
# Needs the reference FASTA.
# Sequence-based cis-element annotation on each fragmentform's MATURE mRNA, with an
# UNBIASED join to every overlapping modification (any mod code -- m6A, 5mC, pseudouridine,
# inosine, ...). Generalizes the PAS check to a family of sequence motifs anchored to the
# transcript's 3' end (PAS, AU-rich element, CPE, GU-rich element, rG4), start codon (Kozak,
# uORF, 5'TOP, m6Am) and stop codon (readthrough context). Only mature-mRNA (exonic) elements
# are scanned -- introns carry no modification signal. Needs the reference FASTA + GTF (for
# start/stop codons) and the aggregate_zn modification table. NOTE: 5'-anchored elements
# (Kozak/uORF/TOP/m6Am) sit where direct-RNA read coverage is sparsest, so their modification
# calls are coverage-limited (each row carries the overlapping mod-site coverage).
sequence_elements:
  enable: true
  pas_window: 60                # nt upstream of the 3' end scanned for a PAS hexamer
  utr3_window: 400              # if a transcript has no annotated stop codon, scan 3'UTR-type
                                # motifs (ARE/CPE/GRE) in the last N nt of the mRNA instead

apa_motifs:
  enable: true
  upstream: 60                  # nt upstream of the cleavage site scanned for a PAS hexamer
  downstream: 40                # nt downstream scored for U/GU-richness
  pas_max_distance: 40          # max nt from hexamer end to cleavage site to count as that site's PAS
  internal_priming_a_frac: 0.65 # downstream A-fraction above which a PAS-less site is called internal priming
  internal_priming_window: 20   # nt downstream used for the A-richness test

# Poly(A) tail length as a first-class readout. Reads the dorado poly(A) estimate (pt:i tag) per
# assigned read from the ZT-tagged BAMs, then: (1) per-fragmentform tail-length distributions;
# (2) differential tail length between the fragmentforms (isoforms) of a gene (Kruskal/Mann-Whitney);
# (3) tail length x modification (per site, tail of modified vs unmodified reads). Requires reads
# basecalled with dorado --estimate-poly-a (the pt:i tag). Tail x mod also needs genotype.enable.
polya:
  enable: true
  jobs: 0                      # 0 = use `threads`; BAM x chrom shards scanned in parallel
  min_tail: 1                  # drop reads with tail_len < this (dorado writes pt:i:0 when no tail is estimated)
  min_fragmentform_reads: 10   # min reads for a fragmentform to enter the between-fragmentform differential
  min_total_reads: 20          # min total reads across a gene's tested fragmentforms
  min_state_reads: 10          # tail x mod: min reads in each state (modified / unmodified) per site
  top_figures: 10              # per-example tail-distribution PNGs to render for the report (top genes / top sites by p_adj)
