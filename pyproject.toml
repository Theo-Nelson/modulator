[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modulator"
version = "0.1.0"
description = "Package-first RNA modification analysis pipeline runner"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML",
]

[project.scripts]
modulator = "modulator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
